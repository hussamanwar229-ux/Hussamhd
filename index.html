<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام شبكتي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff7700;
            object-fit: cover;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 119, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            color: #ff7700;
            margin: 15px 0 25px 0;
            text-align: center;
        }

        .telegram-btn {
            background: linear-gradient(135deg, #ff7700, #ff5500);
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 119, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .app-card {
            background-color: #1e1e1e;
            width: 100%;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
        }

        .app-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid #ff7700;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2a2a2a;
            flex-shrink: 0;
        }

        .app-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-details {
            margin-right: 15px;
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff7700;
            margin-bottom: 5px;
        }

        .download-hint {
            font-size: 14px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الشخصية -->
        <img src="profile.jpg" alt="صورة الحساب" class="profile-pic">
        
        <!-- العنوان -->
        <h1>حسام شبكتي</h1>

        <!-- زر التليجرام -->
        <a href="https://t.me/hussamanwar2000" class="telegram-btn">
            ✈️ انضم لقناتنا على التليجرام
        </a>

        <!-- تطبيق Yacine TV -->
        <a href="Yacine_TV_blue.apk" class="app-card">
            <div class="app-circle">
                <img src="yacine-tv.png" alt="Yacine TV">
            </div>
            <div class="app-details">
                <div class="app-title">Yacine TV</div>
                <div class="download-hint">تحميل مباشر</div>
            </div>
        </a>

        <!-- تطبيق Movie Box -->
        <a href="Movie_Box.apk" class="app-card">
            <div class="app-circle">
                <img src="moviebox.png" alt="Movie Box">
            </div>
            <div class="app-details">
                <div class="app-title">Movie Box</div>
                <div class="download-hint">تحميل مباشر</div>
            </div>
        </a>

    </div>

</body>
</html>
