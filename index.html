<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام شبكتي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 30px;
            color: #ff9800;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .app-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .app-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }
        .download-btn {
            background-color: #ff9800;
            color: #121212;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #f57c00;
        }
    </style>
</head>
<body>

    <h1>تطبيقات حسام المختارة</h1>

    <div class="container">
        <!-- تطبيق الباشا -->
        <div class="app-card">
            <span class="app-name">تطبيق الباشا</span>
            <a href="رابط_تحميل_الباشا" class="download-btn">تحميل</a>
        </div>

        <!-- تطبيق ريزن -->
        <div class="app-card">
            <span class="app-name">تطبيق ريزن</span>
            <a href="رابط_تحميل_ريزن" class="download-btn">تحميل</a>
        </div>

        <!-- تطبيق الأسطورة -->
        <div class="app-card">
            <span class="app-name">تطبيق الأسطورة</span>
            <a href="رابط_تحميل_الأسطورة" class="download-btn">تحميل</a>
        </div>
    </div>

</body>
</html>
