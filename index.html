<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسام شبكتي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
        }

        /* قسم الملف الشخصي والقناة */
        .header-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
            text-align: center;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff6b00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
            margin-bottom: 15px;
        }

        .profile-name {
            color: #ff6b00;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255, 107, 0, 0.3);
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(145deg, #ff8c00, #e65c00);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .telegram-btn:hover {
            transform: scale(1.05);
        }

        /* حاوية التطبيقات */
        .apps-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .app-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            gap: 20px;
            padding: 10px;
            border-radius: 15px;
            transition: background 0.3s ease;
        }

        .app-item:hover {
            background-color: #252525;
        }

        .app-circle {
            width: 100px;
            height: 100px;
            min-width: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff8c00, #e65c00);
            box-shadow: 0 6px 18px rgba(255, 107, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffffff;
            text-align: center;
        }

        .app-circle span {
            font-size: 1.3rem;
            font-weight: 900;
            color: #000000;
            text-transform: lowercase;
        }

        .app-details {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff6b00;
        }

        .download-hint {
            font-size: 0.95rem;
            color: #ff8c00;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية: الصورة + الاسم + التليجرام -->
    <div class="header-profile">
        <img src="profile.jpg" alt="حسام شبكتي" class="profile-img">
        
        <h1 class="profile-name">حسام شبكتي</h1>
        
        <!-- رابط قناة التليجرام -->
        <a href="Https://t.me/hussam_mohamad2000" target="_blank" class="telegram-btn">
            انضم للقناة ✈️
        </a>
    </div>

    <!-- قائمة التطبيقات بالأسفل -->
    <div class="apps-container">

        <!-- تطبيق Yacine TV -->
        <a href="Yacine_TV_blue.apk" class="app-item">
            <div class="app-circle">
                <span>yacine</span>
            </div>
            <div class="app-details">
                <div class="app-title">Yacine TV</div>
                <div class="download-hint">تحميل مباشر</div>
            </div>
        </a>

        <!-- تطبيق MixFlix -->
        <a href="https://www.mediafire.com/file/g68zqipmemk51vh/MixFlix_2.17_kill.apk/file" class="app-item">
            <div class="app-circle">
                <span>mixflix</span>
            </div>
            <div class="app-details">
                <div class="app-title">MixFlix</div>
                <div class="download-hint">تحميل عبر MediaFire</div>
            </div>
        </a>

    </div>

</body>
</html>
