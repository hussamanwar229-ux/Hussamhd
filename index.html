<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التطبيقات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 15px;
        }

        h1 {
            color: #ff6b00;
            margin-bottom: 40px;
            font-size: 2.2rem;
            text-shadow: 0 4px 12px rgba(255, 107, 0, 0.4);
        }

        .apps-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 35px;
            max-width: 900px;
            width: 100%;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .app-item:hover {
            transform: scale(1.08);
        }

        .app-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff8c00, #e65c00);
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffffff;
            cursor: pointer;
            text-align: center;
            padding: 15px;
        }

        .app-circle span {
            font-size: 1.8rem;
            font-weight: 900;
            color: #000000;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .app-title {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .download-hint {
            font-size: 0.9rem;
            color: #ff8c00;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>متجر التطبيقات</h1>

    <div class="apps-container">

        <!-- التطبيق الأول: ياسين TV -->
        <a href="Yacine_TV_blue.apk" class="app-item">
            <div class="app-circle">
                <span>yacine</span>
            </div>
            <div class="app-title">Yacine TV</div>
            <div class="download-hint">اضغط للتحميل المباشر</div>
        </a>

        <!-- التطبيق الثاني: MixFlix -->
        <a href="https://www.mediafire.com/file/g68zqipmemk51vh/MixFlix_2.17_kill.apk/file" class="app-item">
            <div class="app-circle">
                <span>mixflix</span>
            </div>
            <div class="app-title">MixFlix</div>
            <div class="download-hint">تحميل عبر MediaFire</div>
        </a>

    </div>

</body>
</html>
